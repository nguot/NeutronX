[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
# can via_ir do code PartialFill qua nhieu bien 
remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "permit2/=lib/permit2/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

[invariant]
runs = 256
depth = 100

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/NqceSkD9a9GU5a-EbT9wp"
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
